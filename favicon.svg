<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle with Brazilian green -->
  <circle cx="16" cy="16" r="15" fill="#009c3b"/>
  
  <!-- Inner yellow diamond (like Brazilian flag) -->
  <polygon points="16,4 28,16 16,28 4,16" fill="#ffdf00"/>
  
  <!-- Blue circle in center -->
  <circle cx="16" cy="16" r="6" fill="#002776"/>
  
  <!-- White letter B for Brazilian -->
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
