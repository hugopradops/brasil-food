<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background with Brazilian green -->
  <rect width="180" height="180" rx="40" fill="#009c3b"/>
  
  <!-- Yellow diamond (like Brazilian flag) -->
  <polygon points="90,25 160,90 90,155 20,90" fill="#ffdf00"/>
  
  <!-- Blue circle in center -->
  <circle cx="90" cy="90" r="35" fill="#002776"/>
  
  <!-- White letter B for Brazilian Flavors -->
  <text x="90" y="105" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white" text-anchor="middle">B</text>
</svg>
