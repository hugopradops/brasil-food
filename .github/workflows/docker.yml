name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only - the image is never pushed to a registry.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: brasil-food:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
